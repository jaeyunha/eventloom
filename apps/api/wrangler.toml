name = "open-sessionboard-api-local"
main = "src/infrastructure/cloudflare/worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
minify = true

[observability]
enabled = true

[vars]
APP_ENV = "local"
DEPLOYMENT_MODE = "self-hosted"
WEB_ORIGIN = "http://127.0.0.1:3015"
OPENSEND_API_URL = "http://127.0.0.1:8026"
AUTH_FROM_EMAIL = "login@local.example.test"
SPEAKERS_FROM_EMAIL = "program@local.example.test"
CALENDAR_FROM_EMAIL = "schedule@local.example.test"
CALENDAR_UID_DOMAIN = "calendar.local.example.test"

[[d1_databases]]
binding = "DB"
database_name = "open-sessionboard-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-local"
preview_bucket_name = "open-sessionboard-private-files-local"

[[queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-local"
[[queues.consumers]]
queue = "open-sessionboard-outbox-local"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-local-dlq"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgendaCoordinator"]

[env.staging]
name = "open-sessionboard-api-staging"
workers_dev = true

[env.staging.observability]
enabled = true
[env.staging.vars]
APP_ENV = "staging"
DEPLOYMENT_MODE = "managed"
AI_PROVIDER = "disabled"
OPENAI_MODEL = "staging-openai-model-placeholder"
OPENAI_AGENDA_MODEL = "staging-openai-agenda-model-placeholder"
OPENAI_EVALUATION_MODEL = "staging-openai-evaluation-model-placeholder"
OPENAI_REMIX_MODEL = "staging-openai-remix-model-placeholder"
OPENAI_AGENDA_REASONING_EFFORT = "medium"
OPENAI_EVALUATION_REASONING_EFFORT = "high"
OPENAI_REMIX_REASONING_EFFORT = "low"
API_ORIGIN = "https://api-staging.example.invalid"
WEB_ORIGIN = "https://web-staging.example.invalid"
CACHE_INVALIDATION_URL = "https://web-staging.example.invalid/api/internal/cache-invalidation"
OPENSEND_API_URL = "https://opensend-staging.example.invalid"
AUTH_FROM_EMAIL = "auth@staging.example.invalid"
SPEAKERS_FROM_EMAIL = "speakers@staging.example.invalid"
CALENDAR_FROM_EMAIL = "calendar@staging.example.invalid"
CALENDAR_UID_DOMAIN = "calendar.staging.example.invalid"
AIRTABLE_OAUTH_CLIENT_ID = "staging-airtable-oauth-client-placeholder"
AIRTABLE_PAT_CONNECTION_ENABLED = "false"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "open-sessionboard-staging"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[env.staging.r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-staging"
preview_bucket_name = "open-sessionboard-private-files-staging"

[[env.staging.queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-staging"
[[env.staging.queues.consumers]]
queue = "open-sessionboard-outbox-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-staging-dlq"

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.production]
name = "open-sessionboard-api-production"
workers_dev = false

[[env.production.routes]]
pattern = "api-production.example.invalid"
zone_name = "production.example.invalid"
custom_domain = true

[env.production.triggers]
crons = ["*/5 * * * *", "0 * * * *"]

[env.production.observability]
enabled = true
[env.production.vars]
APP_ENV = "production"
DEPLOYMENT_MODE = "managed"
AI_PROVIDER = "disabled"
OPENAI_MODEL = "production-openai-model-placeholder"
OPENAI_AGENDA_MODEL = "production-openai-agenda-model-placeholder"
OPENAI_EVALUATION_MODEL = "production-openai-evaluation-model-placeholder"
OPENAI_REMIX_MODEL = "production-openai-remix-model-placeholder"
OPENAI_AGENDA_REASONING_EFFORT = "medium"
OPENAI_EVALUATION_REASONING_EFFORT = "high"
OPENAI_REMIX_REASONING_EFFORT = "low"
API_ORIGIN = "https://api-production.example.invalid"
WEB_ORIGIN = "https://web-production.example.invalid"
CACHE_INVALIDATION_URL = "https://web-production.example.invalid/api/internal/cache-invalidation"
OPENSEND_API_URL = "https://opensend-production.example.invalid"
AUTH_FROM_EMAIL = "auth@production.example.invalid"
SPEAKERS_FROM_EMAIL = "speakers@production.example.invalid"
CALENDAR_FROM_EMAIL = "calendar@production.example.invalid"
CALENDAR_UID_DOMAIN = "calendar.production.example.invalid"
AIRTABLE_OAUTH_CLIENT_ID = "production-airtable-oauth-client-placeholder"
AIRTABLE_PAT_CONNECTION_ENABLED = "false"

[[env.production.d1_databases]]
binding = "DB"
database_name = "open-sessionboard-production"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[env.production.r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-production"
preview_bucket_name = "open-sessionboard-private-files-production"

[[env.production.queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-production"
[[env.production.queues.consumers]]
queue = "open-sessionboard-outbox-production"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-production-dlq"
