name = "open-sessionboard-api-local"
main = "src/infrastructure/cloudflare/worker.ts"
account_id = "7bcb73282d45e4294cc70dd3e2671bfb"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
minify = true

[observability]
enabled = true

[vars]
APP_ENV = "local"
WEB_ORIGIN = "http://127.0.0.1:3015"

[[d1_databases]]
binding = "DB"
database_name = "open-sessionboard-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-local"
preview_bucket_name = "open-sessionboard-private-files-local"

[[queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-local"
[[queues.consumers]]
queue = "open-sessionboard-outbox-local"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-local-dlq"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgendaCoordinator"]

[env.staging]
name = "open-sessionboard-api-staging"
workers_dev = true

[env.staging.observability]
enabled = true

[env.staging.vars]
APP_ENV = "staging"
API_ORIGIN = "https://open-sessionboard-api-staging.ashleyha0317.workers.dev"
WEB_ORIGIN = "https://open-sessionboard-web-staging.ashleyha0317.workers.dev"
OPENSEND_API_URL = "https://opensend.namuh.co"
AUTH_FROM_EMAIL = "auth@foreverbrowsing.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "open-sessionboard-staging"
database_id = "2e219e9b-05e4-45de-b49b-a7f823e28db8"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[env.staging.r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-staging"
preview_bucket_name = "open-sessionboard-private-files-staging"

[[env.staging.queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-staging"
[[env.staging.queues.consumers]]
queue = "open-sessionboard-outbox-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-staging-dlq"

[env.production]
name = "open-sessionboard-api-production"
workers_dev = true

[env.production.observability]
enabled = true

[env.production.vars]
APP_ENV = "production"
API_ORIGIN = "https://open-sessionboard-api-production.ashleyha0317.workers.dev"
