name = "open-sessionboard-api-local"
main = "src/infrastructure/cloudflare/worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
minify = true

[observability]
enabled = true

[vars]
APP_ENV = "local"
WEB_ORIGIN = "http://127.0.0.1:3015"

[[d1_databases]]
binding = "DB"
database_name = "open-sessionboard-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-local"
preview_bucket_name = "open-sessionboard-private-files-local"

[[queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-local"
[[queues.consumers]]
queue = "open-sessionboard-outbox-local"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-local-dlq"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgendaCoordinator"]

[env.staging]
name = "open-sessionboard-api-staging"
workers_dev = true

[env.staging.observability]
enabled = true
[env.staging.vars]
APP_ENV = "staging"
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-5.6-terra"
OPENAI_AGENDA_MODEL = "gpt-5.6-sol"
OPENAI_EVALUATION_MODEL = "gpt-5.6-sol"
OPENAI_REMIX_MODEL = "gpt-5.6-terra"
OPENAI_AGENDA_REASONING_EFFORT = "medium"
OPENAI_EVALUATION_REASONING_EFFORT = "medium"
OPENAI_REMIX_REASONING_EFFORT = "low"
API_ORIGIN = "https://api-staging.example.invalid"
WEB_ORIGIN = "https://web-staging.example.invalid"
CACHE_INVALIDATION_URL = "https://web-staging.example.invalid/api/internal/cache-invalidation"
OPENSEND_API_URL = "https://opensend.namuh.co"
AUTH_FROM_EMAIL = "auth@sessionboard.namuh.co"
SPEAKERS_FROM_EMAIL = "speakers@sessionboard.namuh.co"
CALENDAR_FROM_EMAIL = "calendar@sessionboard.namuh.co"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "open-sessionboard-staging"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[env.staging.r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-staging"
preview_bucket_name = "open-sessionboard-private-files-staging"

[[env.staging.queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-staging"
[[env.staging.queues.consumers]]
queue = "open-sessionboard-outbox-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-staging-dlq"

[env.production]
name = "open-sessionboard-api-production"
workers_dev = true

[env.production.triggers]
crons = ["0 * * * *"]

[env.production.observability]
enabled = true
[env.production.vars]
APP_ENV = "production"
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-5.6-terra"
OPENAI_AGENDA_MODEL = "gpt-5.6-sol"
OPENAI_EVALUATION_MODEL = "gpt-5.6-sol"
OPENAI_REMIX_MODEL = "gpt-5.6-terra"
OPENAI_AGENDA_REASONING_EFFORT = "medium"
OPENAI_EVALUATION_REASONING_EFFORT = "medium"
OPENAI_REMIX_REASONING_EFFORT = "low"
API_ORIGIN = "https://api-production.example.invalid"
WEB_ORIGIN = "https://web-production.example.invalid"
CACHE_INVALIDATION_URL = "https://web-production.example.invalid/api/internal/cache-invalidation"
OPENSEND_API_URL = "https://opensend.namuh.co"
AUTH_FROM_EMAIL = "auth@sessionboard.namuh.co"
SPEAKERS_FROM_EMAIL = "speakers@sessionboard.namuh.co"
CALENDAR_FROM_EMAIL = "calendar@sessionboard.namuh.co"

[[env.production.d1_databases]]
binding = "DB"
database_name = "open-sessionboard-production"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "AGENDA_COORDINATOR"
class_name = "AgendaCoordinator"

[[env.production.r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "open-sessionboard-private-files-production"
preview_bucket_name = "open-sessionboard-private-files-production"

[[env.production.queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "open-sessionboard-outbox-production"
[[env.production.queues.consumers]]
queue = "open-sessionboard-outbox-production"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "open-sessionboard-outbox-production-dlq"
